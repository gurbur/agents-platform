# platformd configuration for the Raspberry Pi (INTERFACES.md IF-CFG-001).
#
# Install as /etc/platformd/platformd.toml, mode 0640 root:platformd. It is
# deliberately not copied by deploy/deploy.sh: the listen address below is
# specific to the Pi, and the public repository never holds it.

# The Pi's Tailscale IPv4 address and port 7340 (free in the 2026-10-15
# preflight: 22, 8080, 8787 and 20241 are taken). Replace the placeholder;
# `tailscale ip -4` on the Pi prints the address.
listen = "100.x.y.z:7340"

# The only directory the unit lets platformd write (ReadWritePaths).
db_path = "/var/lib/platformd/platform.db"

# Created by the operator with `openssl rand -base64 48`; mode 0640
# root:platformd. Never put the token itself in this file.
owner_token_file = "/etc/platformd/owner.token"

# Receiver callback tuning is optional; omit [delivery] to use the defaults
# documented in platformd.example.toml.

# Owner room posting is optional; without [owner] the owner cannot post into
# rooms (403 for every sender_id). The production hub lets the owner post as
# its human agent: uncomment the table and set post_as = ["human"], then
# restart platformd.service. List only identities that are the owner.
#[owner]
#post_as = []

# Agent presence is optional; without [presence] the defaults documented in
# platformd.example.toml apply. Add the table only after a binary that knows
# it (S14 or later) is installed: older binaries refuse unknown tables.
#[presence]
#default_ttl_secs = 120
#max_ttl_secs = 3600
#last_seen_interval_secs = 60

# Identity attestation is optional; without [identity] the token endpoint
# answers 503 identity_disabled. To enable it, create the key with
#   sudo platformd identity keygen --out /etc/platformd/identity.key
#   sudo chown root:platformd /etc/platformd/identity.key
#   sudo chmod 0640 /etc/platformd/identity.key
# register the printed kid and public_key with the consumer, uncomment the
# table below and restart platformd.service. The seed stays in that file
# only (0640 root:platformd); never put it here. Lifetime keys
# (default_ttl_secs, max_ttl_secs) are documented in platformd.example.toml.
#[identity]
#signing_key_file = "/etc/platformd/identity.key"
#issuer = "agents-platform"
#audiences = ["garage-docs"]
