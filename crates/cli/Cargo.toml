[package]
name = "platform-cli"
description = "Command-line HTTP client for agents-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "platform"
path = "src/main.rs"

[dependencies]
platform-wire.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
# raw_value: `profile show --json` prints a directory item byte for byte.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
ulid.workspace = true

[dev-dependencies]
base64.workspace = true
platformd.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync"] }
