[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
platform-wire = { path = "crates/wire" }
platformd = { path = "crates/server" }

axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.10.3"
# reqwest 0.13: `rustls` = rustls + aws-lc-rs provider + platform verifier. HTTP/1 is always on;
# default features (default-tls, charset, http2, system-proxy) are deliberately off.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"
url = "2.5.8"
