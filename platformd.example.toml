# platformd configuration (INTERFACES.md IF-CFG-001).
# Copy to platformd.toml and adjust. Unknown keys are rejected at startup.
# Relative paths are resolved against the directory of this file.

# Address to listen on. Optional; this is the default.
listen = "127.0.0.1:7340"

# SQLite database file. The parent directory is created if missing.
db_path = "data/platform.db"

# File whose trimmed contents are the owner bearer token (at least 32 bytes).
# Never put the token itself in this file.
owner_token_file = "owner.token"

# Receiver callback tuning. Every key is optional; the values below are the
# defaults from RECEIVER_WAKE_CONVENTION.
[delivery]
connect_timeout_ms = 2000
request_timeout_ms = 5000
backoff_min_secs = 1
backoff_max_secs = 300
redrive_after_secs = 300

# Owner room posting (docs/adr/0007-owner-posts-into-any-room.md). Optional:
# without this table post_as is empty and POST /v1/rooms/{room_id}/messages
# answers 403 for every sender_id. post_as lists the agent_ids the owner may
# post as; list only identities that are the owner (e.g. "human"), never
# another agent. Each entry must be a registered agent to be usable.
#[owner]
#post_as = []

# Agent presence (docs/adr/0012-presence-in-memory-with-persisted-last-seen.md).
# Optional: every key has the default shown. default_ttl_secs is the TTL of a
# PUT /v1/agents/{agent_id}/presence without ttl_secs; a larger ttl_secs than
# max_ttl_secs is 422 ttl_too_long. 1 <= default_ttl_secs <= max_ttl_secs <=
# 86400, or startup is refused. agents.last_seen_at is written at most once
# per agent every last_seen_interval_secs (at least 1).
#[presence]
#default_ttl_secs = 120
#max_ttl_secs = 3600
#last_seen_interval_secs = 60

# Identity attestation (docs/design/IDENTITY_ATTESTATION.md). Optional:
# without this table POST /v1/identity/tokens answers 503 identity_disabled
# and the rest of the API is unaffected. To enable, create the key with
#   platformd identity keygen --out identity.key
# (it prints the kid and public key consumers need), then uncomment below.
# signing_key_file, issuer and audiences are required. The seed lives only in
# signing_key_file (raw 32 bytes, mode 0640 root:platformd on the Pi); never
# put it in this file. 1 <= default_ttl_secs <= max_ttl_secs <= 900, or
# startup is refused.
#[identity]
#signing_key_file = "identity.key"
#issuer = "agents-platform"
#audiences = ["garage-docs"]
#default_ttl_secs = 600
#max_ttl_secs = 900
